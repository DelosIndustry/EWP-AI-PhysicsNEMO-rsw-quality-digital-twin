project:
  name: rsw_quality_digital_twin
  stage: m5_physicsnemo_operator_comparison
  seed: 42
  physicsnemo_version: 2.1.1

data:
  expected_manifest_id: 8a39a964572700bcf06c11dbebf3cde1b0d6430673ce17441d6384eaf51ae8be
  verify_checksums: true

model_candidates:
  fno3d:
    architecture: physicsnemo_fno3d
    in_channels: 10
    out_channels: 1
    dimension: 3
    latent_channels: 16
    num_fno_layers: 4
    num_fno_modes: [6, 6, 6]
    padding: 4
    padding_type: constant
    activation_fn: gelu
    coord_features: true
    decoder_layers: 1
    decoder_layer_size: 32
    decoder_activation_fn: silu
  transolver:
    architecture: physicsnemo_transolver_points
    functional_dim: 10
    out_dim: 1
    embedding_dim: 3
    n_layers: 4
    n_hidden: 128
    dropout: 0.0
    n_head: 8
    act: gelu
    mlp_ratio: 4
    slice_num: 32
    unified_pos: false
    ref: 8
    use_te: false
    time_input: false
    plus: false

training:
  device: cuda
  precision: fp32
  batch_size: 8
  num_workers: 0
  optimizer: adamw
  learning_rate: 1.0e-3
  weight_decay: 0.0
  scheduler: cosine
  epochs: 100
  early_stopping_patience: 100
  gradient_clip_norm: 1.0
  checkpoint_metric: validation_tmax_mae_k
  log_every: 10

overfit:
  sample_count: 64
  require_exact_dataset_size: true
  target_train_field_nrmse: 0.05
  fail_if_no_candidate_passes: true

evaluation:
  splits: [validation]
  measure_performance: true
  latency_warmup: 10
  latency_repetitions: 50
  m4_results_path: projects/rsw_quality_digital_twin/artifacts/m4_baseline_overfit64/m4_results.json

visualization:
  split: validation
  dpi: 150
