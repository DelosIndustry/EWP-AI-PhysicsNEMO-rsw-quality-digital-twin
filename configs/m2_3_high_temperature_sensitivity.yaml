experiment_id: E02_M2_3_high_temperature_bulk_resistivity_sensitivity

# Numerical sensitivity study only. Geometry, reference conductivity, current,
# and contact representation are not calibrated automotive process values.
geometry:
  radius_m: 0.005
  height_m: 0.002
  radial_cells: 10
  axial_cells: 16

electrical:
  reference_conductivity_s_m: 1.0e6
  reference_conductivity_mode: preserve_m2_2_effective_scale_not_absolute_bulk_value
  inactive_conductivity_fraction: 0.08
  contact_radius_m: 0.0022
  peak_current_a: 5700.0
  weld_time_s: 0.04

bulk_resistivity_evidence:
  material_scope: pure_or_electrolytic_iron_proxy_not_automotive_steel_calibration
  units: nano_ohm_m
  low_temperature_k: [300.0, 400.0, 500.0, 600.0, 700.0, 800.0, 900.0, 1000.0]
  low_resistivity_nano_ohm_m: [105.6, 166.6, 241.8, 335.1, 449.1, 583.0, 737.0, 909.0]
  low_source_name: NBS_SP_260_90_Table_4_1_electrolytic_iron_RRR20
  low_source_url: https://www.govinfo.gov/content/pkg/GOVPUB-C13-8476c611bb917728f7f6e93844b12e9c/pdf/GOVPUB-C13-8476c611bb917728f7f6e93844b12e9c.pdf
  low_source_uncertainty_note: recommended_values_corrected_for_thermal_expansion
  bridge_temperature_k: [1100.0, 1200.0, 1300.0, 1400.0]
  bridge_measurement_status: no_direct_points_used_sensitivity_assumptions_only
  high_temperature_k: [1500.0, 1520.0, 1540.0, 1560.0, 1580.0, 1600.0, 1620.0, 1640.0, 1660.0, 1700.0, 1720.0, 1740.0, 1760.0, 1780.0, 1800.0]
  high_resistivity_nano_ohm_m: [1206.6, 1211.0, 1215.4, 1219.8, 1224.2, 1228.6, 1232.9, 1237.3, 1241.7, 1253.5, 1256.5, 1259.6, 1262.6, 1265.7, 1268.7]
  high_source_name: Cezairliyan_McClure_1974_NBS_99_9_percent_iron
  high_source_url: https://nvlpubs.nist.gov/nistpubs/jres/78A/jresv78An1p1_A1b.pdf
  high_measurement_range_k: [1500.0, 1800.0]
  high_reported_resistivity_inaccuracy_fraction: 0.01

bridge_scenarios:
  early_rise:
    exponent: 0.5
    meaning: resistance_rises_earlier_inside_unmeasured_gap
  linear:
    exponent: 1.0
    meaning: straight_endpoint_interpolation
  late_rise:
    exponent: 2.0
    meaning: resistance_rises_later_inside_unmeasured_gap

contact_model_review:
  plate_plate_status: not_calibrated
  electrode_plate_status: not_calibrated
  force_dependence_status: not_implemented
  temperature_dependence_status: not_implemented
  reason: published_models_require_stack_specific_pressure_surface_and_coating_parameters
  source_urls:
    - https://doi.org/10.1179/136217101101538631
    - https://doi.org/10.1016/j.jmatprotec.2007.04.127
    - https://doi.org/10.1016/j.ijheatmasstransfer.2012.01.040

thermal:
  initial_temperature_k: 300.0
  ambient_temperature_k: 300.0
  electrode_cooling_w_m2k: 2.0e4
  interface_conductance_w_m2k: 2.0e5

thermal_material:
  name: example_low_carbon_steel_not_aisi_1010_calibration
  temperature_knots_k: [293.15, 1768.0, 1797.0, 2100.0]
  thermal_conductivity_values_w_mk: [28.4, 28.4, 36.0, 36.0]
  volumetric_heat_capacity_values_j_m3k: [4.76e+6, 4.76e+6, 4.76e+6, 4.76e+6]
  density_kg_m3: 7000.0
  latent_heat_j_kg: 270000.0
  solidus_temperature_k: 1768.0
  liquidus_temperature_k: 1797.0
  reference_temperature_k: 293.15
  calibration_status: literature_plausibility_reference_only

time:
  total_time_s: 0.08
  time_steps: 80
  refinement_time_steps: 160

solver:
  electrical_tolerance: 1.0e-10
  nonlinear_tolerance: 1.0e-9
  maximum_nonlinear_iterations: 50

verification:
  maximum_current_conservation_relative_error: 1.0e-10
  maximum_target_current_relative_error: 1.0e-10
  maximum_terminal_source_energy_relative_gap: 1.0e-10
  maximum_energy_balance_relative_error: 1.0e-8
  maximum_time_refinement_tmax_difference_k: 5.0
  require_phase_activation: true
  require_all_temperatures_inside_curve: true

visualization:
  dpi: 150
