experiment_id: E02_M2_5_contact_law_and_identifiability
base_contact_config: projects/rsw_quality_digital_twin/configs/m2_4_electrical_contact.yaml

contact_law:
  model: bounded_power_law_sensitivity_not_calibration
  stack_id: synthetic_two_sheet_stack
  surface_id: unspecified_uncoated_proxy
  provenance: M2_4_effective_resistance_reconstruction
  calibration_status: synthetic_sensitivity
  reference_temperature_k: 300.0
  reference_force_n: 3500.0
  validity:
    minimum_temperature_k: 300.0
    maximum_temperature_k: 1800.0
    minimum_force_n: 1500.0
    maximum_force_n: 6000.0
    out_of_range_policy: error
  faying:
    temperature_exponent: 0.25
    force_exponent: 0.50
  electrode_sheet:
    temperature_exponent: 0.15
    force_exponent: 0.40

force_scenarios:
  low_force:
    force_n: 2000.0
  nominal_force:
    force_n: 3500.0
  high_force:
    force_n: 5000.0

process:
  peak_current_a: 5200.0
  weld_time_s: 0.04
  interpretation: synthetic_gate_activation_not_calibrated_recipe

time:
  time_steps: 60
  refinement_time_steps: 120

identifiability:
  total_contact_area_resistance_ohm_m2: 1.7888e-9
  decomposition_count: 19
  minimum_faying_fraction: 0.05
  maximum_faying_fraction: 0.95
  conductivity_s_m: 5.0e+6
  current_a: 3000.0
  boundary_heat_fraction_to_sheet: 0.5

external_data:
  mendeley_manifest: projects/rsw_quality_digital_twin/data/manifests/m6_mendeley_ctq_manifest.json
  mendeley_expected_manifest_id: e5afa13f2d4ff33f72127993e0ef87289f425c0f28758a4ce1921ce90bc6fb62
  mendeley_records: projects/rsw_quality_digital_twin/data/processed_external/mendeley_ctq/records.csv
  polito_manifest: projects/rsw_quality_digital_twin/data/manifests/m6_polito_factory_manifest.json
  polito_expected_manifest_id: 9c3b4a099d3f05641f15c18b24f8321b0050691732727e822f2b46ee30e21975
  polito_train: projects/rsw_quality_digital_twin/data/processed_external/polito_factory/train.npz

verification:
  maximum_numerical_relative_error: 1.0e-9
  maximum_static_regression_temperature_error_k: 1.0e-9
  maximum_identical_voltage_relative_spread: 1.0e-10
  minimum_sheet_source_relative_spread: 0.05
  maximum_time_refinement_tmax_difference_k: 5.0
  require_external_absolute_contact_calibration_blocked: true

visualization:
  dpi: 150
