experiment_id: M1_electrical_solver

# Numerical-verification geometry, not a calibrated production weld specification.
geometry:
  radius_m: 0.005
  height_m: 0.002
  radial_cells: 24
  axial_cells: 48

material:
  conductivity_s_m: 1.0e6

boundary:
  target_current_a: 1000.0

convergence:
  radial_cells: 8
  axial_cells: [8, 16, 32, 64]
  relative_conductivity_gradient: 2.0
