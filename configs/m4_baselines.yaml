project:
  name: rsw_quality_digital_twin
  stage: m4_mean_cnn3d_overfit64
  seed: 42

data:
  expected_manifest_id: 8a39a964572700bcf06c11dbebf3cde1b0d6430673ce17441d6384eaf51ae8be
  verify_checksums: true

baseline_models:
  mean:
    architecture: train_target_mean_spacetime_field
  cnn3d:
    architecture: residual_cnn3d
    in_channels: 10
    out_channels: 1
    hidden_channels: 32
    residual_blocks: 4
    kernel_size: 3

training:
  device: cuda
  precision: fp32
  batch_size: 8
  num_workers: 0
  optimizer: adamw
  learning_rate: 2.0e-3
  weight_decay: 0.0
  scheduler: cosine
  epochs: 100
  early_stopping_patience: 100
  gradient_clip_norm: 1.0
  checkpoint_metric: validation_tmax_mae_k
  log_every: 10

overfit:
  # This is an engineering pipeline gate, not an industrial accuracy claim.
  sample_count: 64
  require_exact_dataset_size: true
  target_train_field_nrmse: 0.05
  fail_on_miss: true

evaluation:
  # Test splits stay closed while the 64-sample overfit path is being developed.
  splits: [validation]
  measure_performance: true
  latency_warmup: 10
  latency_repetitions: 50

visualization:
  split: validation
  dpi: 150
