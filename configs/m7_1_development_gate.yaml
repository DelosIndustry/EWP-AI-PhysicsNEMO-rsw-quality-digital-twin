cross_fitting:
  independent_group: sample_id
  stratify_by: category
  outer_folds: 5
  inner_folds: 4
  shuffle: true
  probability_calibration: out_of_fold_multinomial_logistic_stacking
  calibration_c: 1.0

fixed_classifier:
  source: M6.1_random_forest_balanced_hyperparameters
  model_name: random_forest_balanced
  target: category
  classes: [Bad, Explode, Good]
  reference_mapping:
    PASS: [Good]
    FAIL: [Bad, Explode]

decision_policy:
  status: learning_feasibility_not_production_specification
  threshold_source: inner_cross_fitted_development_only
  selection_objective:
    primary: zero_observed_false_escape
    secondary: zero_observed_false_reject
    tertiary: maximize_auto_coverage
  overlap_action: REVIEW
  ood_action: REVIEW
  numerical_failure_action: REVIEW
  illustrative_costs:
    false_escape: 20
    false_reject: 5
    review: 1
  cost_status: illustrative_sensitivity_not_automotive_requirement

ood:
  candidates: [training_range, standardized_ledoit_wolf_mahalanobis]
  mahalanobis_training_quantile: 0.975
  combined_rule: any_candidate_warn_routes_to_review
  known_ood_labels_available: false
  selection_allowed_without_known_ood_labels: false

bootstrap:
  replicates: 2000
  confidence_level: 0.95
  method: stratified_independent_weld_resampling_of_cross_fitted_decisions

verification:
  expected_source_development_welds: 396
  expected_feature_eligible_welds: 393
  expected_category_counts:
    Bad: 17
    Explode: 25
    Good: 351
  expected_outer_prediction_count: 393
  expected_figure_count: 7

polito_track:
  status: separate_M7_2_not_accessed_in_M7_1
  target: Fault
  normalized_signals: [voltage, current, force]
  merge_with_mendeley_category_allowed: false
  si_unit_reconstruction_allowed: false

release_policy:
  automatic_quality_acceptance: false
  production_threshold_claim_allowed: false
  known_ood_recall_claim_allowed: false
  physicsnemo_temperature_field_validation_claim_allowed: false
  automotive_physical_twin_calibration_ready: false
